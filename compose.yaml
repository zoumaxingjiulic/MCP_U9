services:
  u9-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: u9-cloud-mcp:0.3.0
    restart: unless-stopped
    init: true
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      U9_BASE_URL: "${U9_BASE_URL:?U9_BASE_URL is required}"
      U9_ALLOW_HTTP: "${U9_ALLOW_HTTP:-false}"
      U9_CLIENT_ID: "${U9_CLIENT_ID:?U9_CLIENT_ID is required}"
      U9_CLIENT_SECRET: "${U9_CLIENT_SECRET:?U9_CLIENT_SECRET is required}"
      U9_ENT_CODE: "${U9_ENT_CODE:?U9_ENT_CODE is required}"
      U9_ORG_CODE: "${U9_ORG_CODE:?U9_ORG_CODE is required}"
      U9_USER_CODE: "${U9_USER_CODE:?U9_USER_CODE is required}"
      MCP_ACCESS_TOKEN: "${MCP_ACCESS_TOKEN:?MCP_ACCESS_TOKEN is required}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?MCP_ALLOWED_HOSTS is required}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      MCP_MAX_REQUEST_BODY_SIZE: "${MCP_MAX_REQUEST_BODY_SIZE:-1048576}"
      MCP_MAX_SESSIONS: "${MCP_MAX_SESSIONS:-64}"
      MCP_SESSION_IDLE_TIMEOUT: "${MCP_SESSION_IDLE_TIMEOUT:-300}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  u9-chat-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: u9-cloud-mcp:0.3.0
    restart: unless-stopped
    init: true
    depends_on:
      u9-mcp:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - "${CHAT_BIND_IP:-127.0.0.1}:${CHAT_PORT:-8001}:8001"
    environment:
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}"
      DASHSCOPE_MODEL: "${DASHSCOPE_MODEL:?DASHSCOPE_MODEL is required}"
      CHAT_MCP_URL: "http://u9-mcp:8000/mcp"
      MCP_ACCESS_TOKEN: "${MCP_ACCESS_TOKEN:?MCP_ACCESS_TOKEN is required}"
      CHAT_ACCESS_TOKEN: "${CHAT_ACCESS_TOKEN:?CHAT_ACCESS_TOKEN is required}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["u9-chat-console"]
    command: ["--host", "0.0.0.0", "--port", "8001"]
