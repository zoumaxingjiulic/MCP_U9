[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "u9-cloud-mcp"
version = "0.3.0"
description = "Independent, read-only U9 Cloud business tools using the official MCP SDK"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "uvicorn==0.52.4",
]

[project.scripts]
u9-mcp = "u9_mcp.server:main"
u9-chat-console = "u9_mcp.chat_console:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "jsonschema==4.26.0", "ruff==0.16.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/u9_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
